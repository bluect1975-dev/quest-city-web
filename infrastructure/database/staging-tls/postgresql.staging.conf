# Quest City Web — staging PostgreSQL TLS overrides (Tranche E design report
# §10). Mounted read-only into the staging postgres container as an
# `include` from the image's own generated postgresql.conf (see
# docker-compose.staging.yml's postgres command, which passes
# `-c config_file=...` is NOT used here — instead these settings are passed
# as individual `-c` flags in the compose `command:` array, since the
# official postgres image regenerates its own postgresql.conf on first init
# and a mounted full replacement would fight that; a small `-c` flag list is
# the documented-safe way to layer overrides. This file exists as the
# single source of truth that the compose `command:` array is generated
# from — keep them in sync if you change one.

ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
# TLS 1.2 minimum (Tranche E design report §9's TLS floor applied
# consistently to the database connection too, not just the edge).
ssl_min_protocol_version = 'TLSv1.2'
