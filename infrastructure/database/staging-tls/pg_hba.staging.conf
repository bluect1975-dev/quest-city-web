# Quest City Web — staging pg_hba.conf override (Tranche E design report
# §10; ACN/MePA Gap Analysis GAP-09: "Do not weaken TLS validation").
#
# Mounted read-only and referenced via `-c hba_file=...` in
# docker-compose.staging.yml's postgres `command:`. Differs from the
# official postgres image's own generated pg_hba.conf in exactly one way:
# every TCP ("host") rule is `hostssl`, never plain `host` — a client that
# does not negotiate TLS is refused at the protocol level, not merely
# "allowed to skip it". The `local` (Unix socket) rule is unchanged from
# the image default, since the only local-socket client is the container's
# own `pg_isready` healthcheck (`docker-compose.staging.yml`), which never
# leaves the container's filesystem and carries no network exposure to
# protect against.
#
# TYPE    DATABASE    USER    ADDRESS         METHOD
local     all         all                     trust
hostssl   all         all     0.0.0.0/0       scram-sha-256
hostssl   all         all     ::/0            scram-sha-256

# No plain `host` (non-SSL) line exists anywhere in this file — a client
# connecting over TCP without TLS is refused outright, it is never silently
# permitted to fall back to an unencrypted session.
