# Quest City Web — local/orchestrated environment (WEB-M0 deliverable 15).
# Run from the repository root: docker compose -f infrastructure/deployment/docker-compose.yml up
#
# PostgreSQL is bound to the loopback interface only (127.0.0.1), never to
# a public interface (07_06 §3/§4/§7: "niente database pubblicamente
# raggiungibile"). This lets local tooling (tools/migrate.mjs, psql) reach
# it from the host for development, while remaining unreachable from the
# network or from any browser.
#
# Host port 5434 (not the default 5432) avoids colliding with PostgreSQL
# instances you may already have running natively on this machine. Inside
# the Docker network the container still listens on its standard 5432.

services:
  postgres:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quest_city_web
      POSTGRES_USER: quest_city_web
      POSTGRES_PASSWORD: changeme_local_only
    volumes:
      - ../database/data:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d/migrations:ro
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - qc-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest_city_web -d quest_city_web"]
      interval: 5s
      timeout: 3s
      retries: 10
      # start_period (WEB-M3-INFRA-FIX): the bind-mounted data directory
      # (../database/data) survives `docker compose down` between runs. If a
      # previous verify.sh invocation was interrupted (background job
      # killed, terminal closed, `down -v` SIGTERM racing an in-flight
      # write) instead of shutting Postgres down cleanly, the next startup
      # must replay WAL (crash recovery) before accepting connections.
      # Measured locally: clean shutdown -> ready in ~7s; unclean shutdown
      # after a real migrate+integration-test write load -> ~77s of actual
      # redo (see infrastructure/database's own log: "database system was
      # not properly shut down; automatic recovery in progress"), which
      # exceeds the un-padded ~50s retries*interval budget and made Compose
      # report postgres unhealthy before recovery finished. During
      # start_period, failed checks don't count against `retries` and the
      # container isn't marked unhealthy, but a successful check still
      # flips it to healthy immediately -- so the fast (clean-shutdown)
      # path is unaffected. 90s gives ~17% margin over the worst case
      # observed; the unchanged retries*interval budget after start_period
      # elapses adds another ~50s of headroom for a heavier redo.
      start_period: 90s

  api:
    build:
      context: ../..
      dockerfile: infrastructure/containers/api.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quest_city_web:changeme_local_only@postgres:5432/quest_city_web
      DATABASE_SSL: "false"
      HEALTH_READY_DB_TIMEOUT_MS: "2000"
      PORT: "4000"
      # No value, no placeholder, no fallback — ever (WEB-M1 Fase 2 third
      # correction: a committed "local-only" value is still a predictable,
      # versioned secret, since it is used verbatim by anyone who runs this
      # file without an override). The `:?` form makes `docker compose`
      # itself refuse to resolve the config — and therefore refuse to
      # build or start ANY service — if CLASS_CODE_HASH_PEPPER is not set
      # in the invoking shell environment (or a local, gitignored .env).
      # Real staging/production values are provisioned via the secret
      # store (07_06 §9), never committed here or anywhere else.
      CLASS_CODE_HASH_PEPPER: ${CLASS_CODE_HASH_PEPPER:?CLASS_CODE_HASH_PEPPER is required — export it in your shell (see .env.example for how to generate one) before running docker compose.}
      # Master Admin Operations Control Center's Telegram alert channel
      # (02_42 §30, 07_06 §9). Optional -- unlike CLASS_CODE_HASH_PEPPER
      # above, no `:?` guard: apps/api/lib/operations-context.ts falls
      # back to LocalMockAlertChannelAdapter whenever either is unset, so
      # local/CI environments never need a Telegram account. Real values
      # are provisioned via the secret store (07_06 §9) and exported into
      # the invoking shell/.env before `docker compose up` -- never a
      # value in this file. Server-side only: no other service in this
      # compose file (student-web, dashboard, nginx) receives these.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Tranche E2 out-of-band external monitoring, Level 2 (02_42 v1.2
      # PARTE U §53-54). Same "optional, empty default, server-side only"
      # posture as the Telegram pair above -- an independent secret,
      # never the Bot Token (AGENTS.md §4.31 rule 4). No other service in
      # this compose file (student-web, dashboard, nginx) receives these.
      EXTERNAL_MONITOR_HMAC_SECRET_CURRENT: ${EXTERNAL_MONITOR_HMAC_SECRET_CURRENT:-}
      EXTERNAL_MONITOR_HMAC_SECRET_PREVIOUS: ${EXTERNAL_MONITOR_HMAC_SECRET_PREVIOUS:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qc-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  student-web:
    build:
      context: ../..
      dockerfile: infrastructure/containers/student-web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_BASE_URL: http://localhost/api
    networks:
      - qc-internal
    healthcheck:
      # WEB-INFRA-HEALTH-02: mirrors the api service's own healthcheck
      # (node's built-in fetch, no extra package) against an existing,
      # already-served route rather than a new health-only endpoint.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/w').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/containers/dashboard.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      NEXT_PUBLIC_API_BASE_URL_DASHBOARD: http://localhost/api
    networks:
      - qc-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      # WEB-INFRA-HEALTH-02: service_healthy (not the default
      # service_started) so nginx never begins proxying to an upstream
      # that hasn't actually started listening yet -- this was the direct
      # cause of the transient 502s (nginx error log: "connect() failed
      # (111: Connection refused)") that WEB-INFRA-NGINX-01+R3C.2 closure
      # hit repeatedly under verify.sh's own docker compose up --build.
      api:
        condition: service_healthy
      student-web:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks:
      - qc-internal

networks:
  qc-internal:
    driver: bridge
