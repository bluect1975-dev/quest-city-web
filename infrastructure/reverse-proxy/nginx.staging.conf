# Quest City Web — STAGING reverse proxy (Tranche E1; 07_06 §6 "TLS
# obbligatorio con rinnovo automatizzato; redirect HTTP->HTTPS; HSTS dopo
# verifica completa del dominio; header di sicurezza centralizzati").
# Separate file from `nginx.conf` (local dev, plain HTTP only) — local dev
# is completely untouched by this file.
#
# Rebuilt against the CURRENT nginx.conf's routing (not the old, now-
# superseded Tranche E branch's 11-commits-stale copy) — see the Tranche E
# reconciliation report §7/§10 for why a stale routing copy would have been
# wrong. Routes/upstreams/maps below are otherwise unchanged from
# `nginx.conf`: same upstreams, same Referer-based /_next/static/ routing
# (WEB-INFRA-NGINX-01), same /theme-assets/ handling, same health-probe log
# filtering. Only the transport (TLS termination, redirect, security
# headers, rate limiting, tighter timeouts) is new. Any route added to
# `apps/api` automatically stays covered here — every request lands on
# generic `/api/` unless it needs the tighter auth-specific rate-limit zone
# (see below), so this file does not need updating for every new API route.
#
# Certificate provisioning (07_06 §6, vendor-neutral): this file expects a
# certificate/key pair mounted at the paths below by whichever mechanism is
# chosen at E3 implementation time (VPS/DNS exists) — either (a) an ACME
# client (certbot/acme.sh) running as a companion service writing into the
# same shared volume, or (b) a certificate handed to this container by a
# provider-managed TLS gateway. No provider or ACME client is chosen here.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Health probes are frequent; keep access logs focused on real traffic
  # (unchanged from nginx.conf).
  map $request_uri $loggable {
    ~^/(api/)?health/(live|ready)  0;
    default                        1;
  }
  access_log /var/log/nginx/access.log combined if=$loggable;

  # WEB-INFRA-NGINX-01 (unchanged from nginx.conf): /_next/static/* is
  # shared, unprefixed path space for both Next.js apps -- select the real
  # upstream by which page requested the asset.
  map $http_referer $next_static_upstream {
    default                                     student_web;
    "~*^https?://[^/]+/(dashboard|app)(/|$)"    dashboard;
  }

  upstream student_web { server student-web:3000; }
  upstream dashboard    { server dashboard:3001; }
  upstream api          { server api:4000; }

  # Edge rate limiting as a second layer, never a replacement for the
  # existing DB-backed application rate limiting (staff/platform account
  # lockout, presence heartbeat's own 30/min/actor limit, alert-test's
  # 5/5min limit). Sized to tolerate a school class sharing one NAT/public
  # IP. These are E-PILOT STARTING VALUES, not calibrated against a real
  # load test (07_06 §20) — recalibrate once one has been run; do not treat
  # them as final.
  limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=session_zone:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

  # No upload endpoint exists anywhere in the application today (Interactive
  # Learning Experiences / object storage is still NOT_STARTED per the
  # canonical roadmap) — this stays deliberately tight until a real
  # endpoint needs more.
  client_max_body_size 2m;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Plain HTTP: redirect-only, plus the ACME HTTP-01 challenge path if that
  # mechanism is the one chosen at E3 implementation time. Never serves
  # application content.
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/acme;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # --- TLS ---
    # Paths populated by whichever certificate mechanism is chosen at E3
    # implementation time — see the file header comment. For E1's own local
    # HTTPS smoke test, an operator places a self-signed pair here
    # manually (infrastructure/reverse-proxy/staging-tls-certs/, gitignored).
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Security headers ---
    # Phase 1 HSTS max-age (5 minutes) — deliberately short. Do NOT extend
    # to a year or add `preload` until the domain has run stably on TLS for
    # a real observation period (E3, once a real domain exists).
    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Frame-Options "DENY" always;
    # KNOWN LIMITATION, documented rather than silently accepted (Tranche
    # E1 mission §7): 'unsafe-inline' on script-src/style-src is a
    # pragmatic baseline for Next.js standalone output, which injects
    # inline hydration data absent a nonce-based middleware (not present in
    # this codebase today — implementing one is out of E1 scope). This
    # MUST be verified against a real staging deploy in a real browser (no
    # CSP console errors on dashboard/student-web) and is a named target
    # for a future hardening pass to remove — loosen only the specific
    # violating directive if the pass finds one still needed, never the
    # whole policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Correlation ID: preserve an inbound one, otherwise let the upstream
    # Next.js proxy.ts mint it (unchanged from nginx.conf).
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
      proxy_pass http://$next_static_upstream;
    }

    location /theme-assets/ {
      proxy_pass http://student_web;
    }

    location /w {
      limit_req zone=api_zone burst=60 nodelay;
      proxy_pass http://student_web;
    }

    location /dashboard {
      limit_req zone=api_zone burst=60 nodelay;
      proxy_pass http://dashboard;
    }

    location /app {
      limit_req zone=api_zone burst=60 nodelay;
      proxy_pass http://dashboard;
    }

    # Auth-sensitive endpoints get the tighter zone.
    location /api/staff-auth/ {
      limit_req zone=auth_zone burst=10 nodelay;
      proxy_pass http://api/staff-auth/;
    }

    location /api/platform-auth/ {
      limit_req zone=auth_zone burst=10 nodelay;
      proxy_pass http://api/platform-auth/;
    }

    location /api/web-auth/session {
      limit_req zone=session_zone burst=15 nodelay;
      proxy_pass http://api/web-auth/session;
    }

    location /api/ {
      limit_req zone=api_zone burst=60 nodelay;
      proxy_pass http://api/;
    }

    location / {
      return 302 /w;
    }
  }
}
