# Quest City Web — Nginx reverse proxy (07_06 §3 topology; ADR-0001 records
# the Nginx-vs-Caddy choice per 07_06 §6).
#
# Routes:
#   /w         -> student-web
#   /dashboard -> dashboard (WEB-M0 placeholder root only)
#   /app       -> dashboard (WEB-M3B staff dashboard screens — same app,
#                 same upstream as /dashboard, per the WEB-M0 placeholder's
#                 own stated intent: "La futura IA delle schermate (02_23)
#                 vivrà sotto /app all'interno di questa stessa
#                 applicazione — non come una dashboard separata.")
#   /api       -> api (health endpoints live under /api/health/*)
#
# PostgreSQL and every other internal service are reachable only on the
# Docker-internal network — this file exposes no port to them, matching
# 07_06 §3/§4/§7: "niente database pubblicamente raggiungibile."

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Health probes are frequent; keep access logs focused on real traffic.
  map $request_uri $loggable {
    ~^/(api/)?health/(live|ready)  0;
    default                        1;
  }
  access_log /var/log/nginx/access.log combined if=$loggable;

  upstream student_web { server student-web:3000; }
  upstream dashboard    { server dashboard:3001; }
  upstream api          { server api:4000; }

  server {
    listen 80;
    server_name _;

    # Correlation ID: preserve an inbound one, otherwise let the upstream
    # Next.js proxy.ts mint it (07_05 §12, deliverable 18).
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /w {
      proxy_pass http://student_web;
    }

    location /dashboard {
      proxy_pass http://dashboard;
    }

    location /app {
      proxy_pass http://dashboard;
    }

    location /api/ {
      proxy_pass http://api/;
    }

    location / {
      return 302 /w;
    }
  }
}
