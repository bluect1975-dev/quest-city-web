# Quest City Web — Nginx reverse proxy (07_06 §3 topology; ADR-0001 records
# the Nginx-vs-Caddy choice per 07_06 §6).
#
# Routes:
#   /w             -> student-web
#   /dashboard     -> dashboard (WEB-M0 placeholder root only)
#   /app           -> dashboard (WEB-M3B staff dashboard screens — same app,
#                     same upstream as /dashboard, per the WEB-M0 placeholder's
#                     own stated intent: "La futura IA delle schermate (02_23)
#                     vivrà sotto /app all'interno di questa stessa
#                     applicazione — non come una dashboard separata.")
#   /api           -> api (health endpoints live under /api/health/*)
#   /theme-assets/ -> student-web (Tranche 5 theme/scene asset manifest —
#                     Next.js public/ assets served at the app's root path)
#
# PostgreSQL and every other internal service are reachable only on the
# Docker-internal network — this file exposes no port to them, matching
# 07_06 §3/§4/§7: "niente database pubblicamente raggiungibile."
#
# WEB-INFRA-NGINX-01: neither student-web nor dashboard sets a Next.js
# basePath/assetPrefix, so both serve their compiled JS chunks under the
# identical literal path shape /_next/static/chunks/<hash>.js -- there is
# no path-based way to tell the two apps' assets apart (a dashboard chunk
# hash 404s if proxied to student-web and vice versa, verified). The
# browser's own Referer header is the one reliable, app-code-free signal
# available: every asset request is made by a page already loaded from
# either /w/* or /dashboard/*|/app/*, so this map routes purely on that
# header. Default is student_web (the more heavily used surface today);
# api and health-check clients never request /_next/static/*.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Health probes are frequent; keep access logs focused on real traffic.
  map $request_uri $loggable {
    ~^/(api/)?health/(live|ready)  0;
    default                        1;
  }
  access_log /var/log/nginx/access.log combined if=$loggable;

  # WEB-INFRA-NGINX-01: /_next/static/* is shared, unprefixed path space
  # for both Next.js apps -- select the real upstream by which page
  # requested the asset (see the note above the Routes list).
  map $http_referer $next_static_upstream {
    default                                     student_web;
    "~*^https?://[^/]+/(dashboard|app)(/|$)"    dashboard;
  }

  upstream student_web { server student-web:3000; }
  upstream dashboard    { server dashboard:3001; }
  upstream api          { server api:4000; }

  server {
    listen 80;
    server_name _;

    # Correlation ID: preserve an inbound one, otherwise let the upstream
    # Next.js proxy.ts mint it (07_05 §12, deliverable 18).
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
      proxy_pass http://$next_static_upstream;
    }

    # M06 Web Full Vertical Slice Tranche 5 (`07_26 v1.1` §13/§17): theme
    # assets (`apps/student-web/public/theme-assets/**`) are served by
    # Next.js at the literal root path, same as `/_next/static/` above,
    # because student-web sets no basePath -- without this location block
    # every asset request falls into the catch-all `location /` 302 below.
    location /theme-assets/ {
      proxy_pass http://student_web;
    }

    location /w {
      proxy_pass http://student_web;
    }

    location /dashboard {
      proxy_pass http://dashboard;
    }

    location /app {
      proxy_pass http://dashboard;
    }

    location /api/ {
      proxy_pass http://api/;
    }

    location / {
      return 302 /w;
    }
  }
}
