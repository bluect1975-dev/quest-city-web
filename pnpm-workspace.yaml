packages:
  - "apps/*"
  - "packages/*"
  - "tools"
  - "tests/integration"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1115.0'
# Transitive-dependency CVE floor (tools/check-dependency-audit.mjs gate) —
# next@16.3.1/vitest@3.2.7 above already pull patched sharp/postcss/nanoid
# for most paths, but a second (now-stale) postcss/nanoid chain existed via
# next@16.2.9 specifically; forcing a floor here is a real fix that removes
# the vulnerable range everywhere, not a version bump anyone has to
# rediscover next time an unrelated package.json edit reintroduces the old
# resolution. Bump the floor forward, don't remove entries, as new CVEs are
# found — this is a minimum, not a pin.
overrides:
  sharp: ">=0.35.0"
  postcss: ">=8.5.23"
  nanoid: ">=3.3.18"
